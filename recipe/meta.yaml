{% set info = load_file_data("iotaa/resources/info.json") %}
{% set minpy = "3.10" %}

package:
  name: iotaa
  version: {{ info["version"] }}
source:
  path: ../src
build:
  include_recipe: false
  noarch: python
  number: {{ info["buildnum"] }}
requirements:
  host:
    - pip
    - python {{ minpy }}
    - setuptools
  run:
    - python >={{ minpy }}
test:
  requires:
    - docformatter 1.7.7.* # 1.7.8 is buggy
    - jq 1.8.*
    - m4 1.4.*
    - mypy 2.3.*
    - pyfakefs 6.2.*
    - pytest 9.1.*
    - pytest-cov 7.1.*
    - pytest-randomly 3.15.*
    - pytest-xdist 3.8.*
    - python {{ minpy }}
    - requests 2.34.*
    - ruff 0.16.*
about:
  home: https://github.com/maddenp/iotaa
  license: APACHE
